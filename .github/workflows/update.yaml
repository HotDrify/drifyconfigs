name: update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: xray-knife
        run: |
          wget https://github.com/lilendian0x00/xray-knife/releases/download/v11.5.0/Xray-knife-linux-64.zip
          unzip Xray-knife-linux-64.zip
          
      - name: test
        run: |
          mkdir -p subscribes
          xargs -n1 -P10 curl -fsSL --max-time 20 -A "Mozilla/5.0" < .github/workflows/mirrors.txt 2>/dev/null \
          | grep -Eo '(vmess|vless|ss|trojan)://[^"'"'"' <>\s]+' | sort -u > configs.txt
          ./xray-knife http -f configs.txt -t 50 -o subscribes/sub.txt
        
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add subscribes/
          git commit -m "subs $(date +%F)" || exit 0
          git push
