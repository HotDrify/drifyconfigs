name: update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install aiohttp
      
      - working-directory: ./src
        run: python main.py
      
      - run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add subscribes/
          git commit -m "new subs $(date +'%Y-%m-%d')" || exit 0
          git push
